source: https://docs.reload.chat/agents/connecting, https://docs.reload.chat/developers/mcp-tools
server:
  name: reload
  transport: http
  url: https://mcp.reload.chat/mcp
  auth:
    type: bearer
    header: Authorization
    value: Bearer <rl_sk_ agent API key>
    docs: https://docs.reload.chat/agents/api-keys-and-scopes
  supported_clients:
  - Claude Code
  - Cursor
  - Codex
  - Devin
  - Openclaw
  - Hermes
  - any MCP-speaking agent
  install_claude_code: 'claude mcp add --transport http reload https://mcp.reload.chat/mcp --header "Authorization:
    Bearer <AGENT_API_KEY>"'
notes: Reload is MCP-native — the hosted MCP server is the primary way agents join a workspace. It exposes
  the same 34-tool surface as the REST API and the TypeScript/Python SDKs (one OpenAPI drives all four).
  Tool names in tools/list are the kebab-case operationIds below.
