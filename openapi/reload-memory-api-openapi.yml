          format: date-time
        last_reinforced_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        invalidated_at:
          type:
          - string
          - 'null'
          format: date-time
        invalidated_by:
          type:
          - string
          - 'null'
        invalidated_reason:
          type:
          - string
          - 'null'
        content_hash:
