components:
  schemas:
    EdgeType:
      type: string
      enum:
      - OWNS
      - OPERATED_BY
      - MEMBER_OF
      - IN_SCOPE
      - IN_CHANNEL
      - AUTHORED
      - IN_THREAD
      - MENTIONS
      - DERIVED_FROM
      - STATED_BY
      - SUPERSEDES
      - CONTRADICTS
      - SUPPORTS
      - REFERENCES
      - CAN_READ
      - CAN_WRITE
      description: Locked context-graph edge catalogue.
    FlagContradictionRequest:
      type: object
      properties:
        a_id:
          type: string
        b_id:
          type: string
        note:
          type: string
      required:
      - a_id
      - b_id
      - note
      additionalProperties: false
    ReloadError:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          type: object
          properties:
            code:
              type: string
              description: '`/v1/agent/*` returns lowercase coarse codes (permission_denied, channel_not_member, not_found, invalid_input, conflict, rate_limited, upstream_unavailable, internal_error). `/v1/sdk/*` returns UPPERCASE ErrorCode values (AUTH_*, FORBIDDEN, WORKSPACE_ACCESS_DENIED, CHANNEL_PERMISSION_DENIED, VALIDATION_ERROR, INVALID_PARAMS, NOT_FOUND, CONFLICT, ALREADY_EXISTS, RATE_LIMITED, PAYMENT_REQUIRED, INTERNAL_ERROR, DATABASE_ERROR, GRAPH_UNAVAILABLE, SERVICE_UNAVAILABLE, VERSION_CONFLICT, FEATURE_DISABLED).'
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            retryable:
              type: boolean
              description: '`/v1/agent/*` only — whether retrying with the same args may succeed.'
            suggestion:
              type: string
              description: '`/v1/sdk/*` only — a human-actionable hint.'
            docs:
              type: string
              description: '`/v1/sdk/*` only — a documentation URL.'
          required:
          - code
          - message
          additionalProperties: false
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - success
      - error
      additionalProperties: false
    MessageOutput:
      type: object
      properties:
        id:
          type: string
        channel_id:
          type: string
        thread_id:
          type:
          - string
          - 'null'
        author_identity_id:
          type: string
        kind:
          type: string
        content:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        version:
          type: integer
      required:
      - id
      - channel_id
      - thread_id
      - author_identity_id
      - kind
      - content
      - metadata
      - created_at
      - version
      additionalProperties: false
    Meta:
      type: object
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required:
      - requestId
      - timestamp
      additionalProperties: false
    RecallFilters:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/MemoryKind'
        include_superseded:
          type: boolean
          default: false
        include_invalidated:
          type: boolean
          default: false
        include_expired:
          type: boolean
          default: false
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
        min_similarity:
          type: number
          minimum: 0
          maximum: 1
          description: Cosine-similarity floor in [0,1].
      additionalProperties: false
    BootstrapContextEnvelope:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
        data:
          $ref: '#/components/schemas/BootstrapContext'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - success
      - data
      additionalProperties: false
    TtlPreset:
      type: string
      enum:
      - VOLATILE
      - ACTIVE
      - STABLE
      description: 'Named TTL bucket: 7d / 90d / 365d.'
    MemoryKind:
      type: string
      enum:
      - decision
      - fact
      - preference
      description: Memory node kind (locked V1 vocabulary).
    LinkToType:
      type: string
      enum:
      - memory
      - message
      - artifact
      - identity
      description: Target node kind for a generic edge.
    DerivedFromRef:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/DerivedFromKind'
        id:
          type: string
      required:
      - kind
      - id
      additionalProperties: false
    ScopeRef:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        kind:
          $ref: '#/components/schemas/ScopeKind'
        name:
          type: string
      required:
      - id
      - org_id
      - kind
      - name
      additionalProperties: false
    EdgeOutput:
      type: object
      properties:
        id:
          type: string
        from_id:
          type: string
        from_type:
          type: string
        to_id:
          type: string
        to_type:
          type: string
        edge_type:
          $ref: '#/components/schemas/EdgeType'
        properties:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - from_id
      - from_type
      - to_id
      - to_type
      - edge_type
      - properties
      - created_at
      additionalProperties: false
    EdgeOutputEnvelope:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
        data:
          $ref: '#/components/schemas/EdgeOutput'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - success
      - data
      additionalProperties: false
    RevalidateRequest:
      type: object
      properties:
        memory_id:
          type: string
        expected_version:
          type: integer
      required:
      - memory_id
      - expected_version
      additionalProperties: false
    MemoryOutputEnvelope:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
        data:
          $ref: '#/components/schemas/MemoryOutput'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - success
      - data
      additionalProperties: false
    LinkRequest:
      type: object
      properties:
        from_id:
          type: string
        to_id:
          type: string
        edge_type:
          $ref: '#/components/schemas/EdgeType'
        to_type:
          $ref: '#/components/schemas/LinkToType'
        properties:
          type: object
          additionalProperties: true
      required:
      - from_id
      - to_id
      - edge_type
      additionalProperties: false
    MemoryOutput:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        kind:
          $ref: '#/components/schemas/MemoryKind'
        status:
          $ref: '#/components/schemas/MemoryStatus'
        content:
          type: string
        confidence:
          type: number
          description: 0–1.
        version:
          type: integer
        ttl_seconds:
          type:
          - integer
