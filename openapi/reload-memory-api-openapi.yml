    BootstrapContextRequest:
      type: object
      properties:
        agent_identity_id:
          type: string
        scope_id:
          type: string
      required:
      - agent_identity_id
      additionalProperties: false
    SearchMemoriesResponse:
      type: object
      properties:
        hits:
          type: array
          items:
            $ref: '#/components/schemas/MemoryOutput'
        nextCursor:
          type:
          - string
          - 'null'
      required:
      - hits
      - nextCursor
      additionalProperties: false
    InvalidateRequest:
      type: object
      properties:
        memory_id:
          type: string
        expected_version:
          type: integer
        reason:
          type: string
      required:
      - memory_id
      - expected_version
      - reason
      additionalProperties: false
    RecallExpansion:
      type: string
      enum:
      - provenance
      - related
      description: Edge-expansion mode for recall.
    SearchMemoriesEnvelope:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
        data:
          $ref: '#/components/schemas/SearchMemoriesResponse'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - success
      - data
      additionalProperties: false
    RecallSubgraphEnvelope:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
        data:
          $ref: '#/components/schemas/RecallSubgraph'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - success
      - data
      additionalProperties: false
    ScopeKind:
      type: string
      enum:
      - org
      - team
      - project
      - channel
      description: Scope hierarchy level.
    RememberRequest:
      type: object
      properties:
        content:
          type: string
        kind:
          $ref: '#/components/schemas/MemoryKind'
        scope_id:
          type: string
        derived_from:
          type: array
          items:
            $ref: '#/components/schemas/DerivedFromRef'
          minItems: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 1
        ttl_seconds:
          type: integer
          description: Raw TTL. Provide this OR ttl_preset, not both.
        ttl_preset:
          $ref: '#/components/schemas/TtlPreset'
        stated_by_identity_id:
          type: string
        where:
          type: string
          description: 5W "Where" — origin context the claim was made in.
        why:
          type: string
          description: 5W "Why" — reason the claim was captured.
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata. Capped at 4KB serialized (server rejects oversize).
      required:
      - content
      - kind
      - scope_id
      - derived_from
      additionalProperties: false
    SupersedeRequest:
      type: object
      properties:
        old_memory_id:
          type: string
        expected_version:
          type: integer
          description: Optimistic-lock guard. Mismatch → 409.
        new_content:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 1
        derived_from:
          type: array
          items:
            $ref: '#/components/schemas/DerivedFromRef'
          minItems: 1
        ttl_seconds:
          type: integer
        ttl_preset:
          $ref: '#/components/schemas/TtlPreset'
        stated_by_identity_id:
          type: string
        where:
          type: string
        why:
          type: string
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON metadata. Capped at 4KB serialized (server rejects oversize).
      required:
      - old_memory_id
      - expected_version
      - new_content
      - derived_from
      additionalProperties: false
    RecallSubgraph:
      type: object
      properties:
        hits:
          type: array
          items:
            $ref: '#/components/schemas/MemoryOutput'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/EdgeOutput'
        scores:
          type: array
          items:
            $ref: '#/components/schemas/RecallScore'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageOutput'
      required:
      - hits
      - edges
      - scores
      additionalProperties: false
    RecallScore:
      type: object
      properties:
        memory_id:
          type: string
        total:
          type: number
        similarity:
          type: number
        confidence_bonus:
          type: number
        recency_penalty:
          type: number
        supersession_penalty:
          type: number
      required:
      - memory_id
      - total
      - similarity
      - confidence_bonus
      - recency_penalty
      - supersession_penalty
      additionalProperties: false
    MemoryStatus:
      type: string
      enum:
      - current
      - proposed
      - superseded
      - contested
      - expired
      - invalidated
      description: Memory state-machine status.
    RecallRequest:
      type: object
      properties:
        query:
          type: string
          description: Semantic query. Provide exactly one of query or seed_id.
        seed_id:
          type: string
          description: Neighborhood-walk seed. Provide exactly one of query or seed_id.
        depth:
          type: integer
          minimum: 1
          maximum: 3
          description: BFS walk depth (with seed_id).
        scope_id:
          type: string
        expand:
          type: array
          items:
            $ref: '#/components/schemas/RecallExpansion'
          default:
          - provenance
          - related
        filters:
          $ref: '#/components/schemas/RecallFilters'
        metadata_filter:
          type: object
          additionalProperties: true
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      additionalProperties: false
    DerivedFromKind:
      type: string
      enum:
      - message
      - artifact
      - memory
      description: Polymorphic target kind for a provenance pointer.
    PaginationMeta:
      type: object
      properties:
        cursor:
          type:
          - string
          - 'null'
        hasMore:
          type: boolean
        total:
          type: integer
        historyCutoff:
          type:
          - object
          - 'null'
          properties:
            beyondCount:
              type: integer
            cutoffAt:
              type: string
              format: date-time
          required:
          - beyondCount
          - cutoffAt
          additionalProperties: false
      required:
      - hasMore
      additionalProperties: false
    BootstrapContext:
      type: object
      properties:
        current_decisions:
          type: array
          items:
            $ref: '#/components/schemas/MemoryOutput'
        active_constraints:
          type: array
          items:
            $ref: '#/components/schemas/MemoryOutput'
        open_questions:
          type: array
          items:
            $ref: '#/components/schemas/MemoryOutput'
        scope_membership:
          type: array
          items:
            $ref: '#/components/schemas/ScopeRef'
        recent_activity:
          type: string
      required:
      - current_decisions
      - active_constraints
      - open_questions
      - scope_membership
      - recent_activity
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: rl_ API key
